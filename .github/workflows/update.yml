name: Actualiza calendario Estu

on:
  schedule:
    # lunes y viernes 12:00 UTC (tras jornada + previa del finde)
    - cron: "0 12 * * 1,5"
  workflow_dispatch:  # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: calendario-estu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenera calendario (solo stdlib)
        run: python3 scripts/scrape.py
      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/partidos.json datos/sedes.json estudiantes.ics
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -m "auto: actualiza calendario Estu $(date -u +%F)"
          git push
